<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Canteen - Menu</title>
    <link rel="stylesheet" href="src/css/output.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <nav class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">Campus Canteen</h1>
        <div>
            <span id="user-display" class="mr-4">Student</span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-semibold">Logout</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6 mt-6">
        <h2 class="text-2xl font-bold mb-4">Pre-Order Menu</h2>
        <div id="menu-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Menu items will be injected here by JS -->
        </div>
    </main>

    <script src="src/js/menu.js"></script>
</body>
</html>
