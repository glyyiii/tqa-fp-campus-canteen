<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Orders | Fookeyqou Campus Canteen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { brand: { light: '#F9F6F0', DEFAULT: '#D97706', dark: '#B45309' }, dark: '#1C1917' }, fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['"Inter"', 'sans-serif'], } } } }</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; background-color: #F9F6F0; }</style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">
    <!-- Top Navigation -->
    <nav class="bg-white border-b border-gray-100 px-8 py-4 flex justify-between items-center sticky top-0 z-40">
                <div class="flex items-center gap-2">
            <img src="img/logo.png" alt="Fookeyqou Logo" class="h-12 w-auto object-contain">
            <span class="font-serif font-bold text-2xl tracking-tight text-dark">Fookeyqou</span>
        </div>
        <div class="hidden md:flex gap-8 font-medium text-sm text-gray-500">
            <a href="index.html" class="hover:text-gray-900 transition">Menu</a>
            <a href="orders.html" class="text-brand font-semibold border-b-2 border-brand pb-1">My Orders</a>
            <a href="reports.html" class="hover:text-gray-900 transition">Reports</a>
        </div>
        <div class="flex items-center gap-4"><button onclick="logout()" class="bg-gray-100 text-gray-600 px-5 py-2.5 rounded-full text-sm font-semibold hover:bg-gray-200 transition">Sign Out</button></div>
    </nav>

    <main class="max-w-5xl mx-auto w-full px-8 py-12 flex-1">
        <h1 class="font-serif text-4xl font-bold text-dark mb-8">Order History</h1>
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-brand-light border-b border-gray-200">
                    <tr>
                        <th class="p-5 font-semibold text-gray-500 text-sm uppercase tracking-wider">Order ID</th>
                        <th class="p-5 font-semibold text-gray-500 text-sm uppercase tracking-wider">Item Name</th>
                        <th class="p-5 font-semibold text-gray-500 text-sm uppercase tracking-wider">Qty</th>
                        <th class="p-5 font-semibold text-gray-500 text-sm uppercase tracking-wider">Total</th>
                        <th class="p-5 font-semibold text-gray-500 text-sm uppercase tracking-wider">Status</th>
                    </tr>
                </thead>
                <tbody id="orders-table"></tbody>
            </table>
        </div>
    </main>

    <script>
        const userId = localStorage.getItem('user_id');
        if(!userId) window.location.href = 'login.html';
        fetch(`http://localhost:8000/api/orders/${userId}`)
            .then(res => res.json())
            .then(orders => {
                const tbody = document.getElementById('orders-table');
                if(orders.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-500">No orders yet.</td></tr>'; return; }
                orders.forEach(o => {
                    tbody.innerHTML += `
                        <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                            <td class="p-5 text-sm text-gray-500 font-medium">#${o.id}</td>
                            <td class="p-5 font-bold text-dark">${o.item_name}</td>
                            <td class="p-5 text-sm text-gray-600">${o.quantity}</td>
                            <td class="p-5 font-bold text-brand">₱${o.total_price.toFixed(2)}</td>
                            <td class="p-5"><span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-xs font-bold border border-yellow-200">${o.status.toUpperCase()}</span></td>
                        </tr>
                    `;
                });
            });
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
